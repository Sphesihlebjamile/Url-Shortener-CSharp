<div class="w-full flex-col items-center">
    <p>
    Enter your URL here
    </p>
    <div class="w-full flex flex-col items-center">
    <input 
        class="shadow appearance-none border rounded w-full py-2 px-3 m-2 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="longUrl" type="url"
        placeholder="Long Url"
        [(ngModel)]="longUrl"
    />
    <div class="w-full flex flex-col ml-6 text-red-400 items-start font-bold">
        @for (longUrlError of longUrlErrors(); track $index) {
            <small class="py-1">- {{ longUrlError }}</small>
        }
    </div>
    <button 
        class="cursor-pointer bg-transparent hover:bg-neutral-800 text-black font-semibold hover:text-neutral-200 m-2 py-2 px-4 border border-neutral-800 hover:border-transparent rounded w-[50%] disabled:cursor-not-allowed disabled:opacity-50"
        [disabled]="isGenerating()"
        (click)="handleSubmit()"
    >
        {{ isGenerating() ? 'Generating...' : 'Generate Short Url' }}
    </button>
    </div>
</div>
